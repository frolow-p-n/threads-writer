name: tick

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (GitHub может задерживать на несколько минут)
  workflow_dispatch:
    inputs:
      dry:
        description: "Холостой прогон (ничего не публиковать)"
        type: boolean
        default: false

concurrency:
  group: threads-writer-tick   # не допускаем два одновременных запуска
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts tick ${{ inputs.dry && '--dry' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_EXPIRES: ${{ secrets.THREADS_TOKEN_EXPIRES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
