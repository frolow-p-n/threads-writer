name: tick

on:
  # Собственное расписание GitHub убрано: оно не знает про часы сна и срабатывало бы ночью
  # независимо от Supabase. Единственный триггер теперь — Supabase pg_cron (см.
  # supabase/migrations/005_cron_sleep_hours.sql), который дёргает workflow_dispatch сам.
  workflow_dispatch:
    inputs:
      dry:
        description: "Холостой прогон (ничего не публиковать)"
        type: boolean
        default: false

concurrency:
  group: threads-writer-tick   # не допускаем два одновременных запуска
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts tick ${{ inputs.dry && '--dry' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_EXPIRES: ${{ secrets.THREADS_TOKEN_EXPIRES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
      - name: Уведомить об ошибке запуска
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}" -d message_thread_id="${TELEGRAM_TOPIC_ID}"             --data-urlencode "text=❌ ThreadsWriter: запуск упал. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
