# Расписание (используется со стадии 6)
posts_per_day: 2
windows: ["12:00-13:30", "19:00-23:00"]   # по времени Нью-Йорка
timezone: America/New_York
jitter_minutes: 25

# Контент
photo_post_ratio: 1.0      # доля постов с фото (1.0 = всегда фото + история)
min_post_chars: 300        # истории должны быть полноценными
max_post_chars: 500        # лимит Threads
critic_min_score: 7
max_revisions: 3
memory_size: 30            # сколько прошлых постов подмешивать в промпт

models:
  vision: gpt-6-luna           # (было gpt-4o-mini, отключается 14.01.2027)
  writer: gpt-6-luna          # ответы на комментарии (было gpt-4.1-mini)
  story: gpt-4.1              # замысел и текст постов (gpt-4.1 заметно острее, но примерно в 6 раз дороже)
  critic: gpt-4.1-mini
  classifier: gpt-6-luna      # (было gpt-4.1-mini)

# Ответы на комментарии
replies:
  enabled: true
  max_per_day: 100              # потолок ответов в сутки (лимит Threads: 1000)
  max_per_run: 8                # за один запуск (раз в 30 мин), чтобы не отвечать пачкой
  delay_min: 2                  # минут: ждём после комментария, прежде чем ответить
  delay_max: 10                 # у каждого комментария своя задержка в этих рамках
  reaction_reply_chance: 0.5    # на короткие реакции (эмодзи, nice) отвечаем в половине случаев
  max_replies_per_user_per_post: 2
  lookback_days: 7              # смотрим комментарии под постами за последние N дней
  reply_max_chars: 240

# Доля постов, где история уходит в другой мир (остальное: её жизнь с неожиданным поворотом)
fantasy_ratio: 0.65

# Праздничные недели: за lead_days дней до праздника (и в сам день) часть постов тематическая.
holidays:
  enabled: true
  theme_chance_in_window: 0.65   # доля тематических постов в окне «до праздника»
  theme_chance_on_day: 1.0       # в сам день праздника
  list:
    - { id: valentines,   name: "Valentine's Day",  month: 2,  day: 14, lead_days: 7, theme: "флирт, симпатия, смешные неудачные свидания, анти-валентинка, сердечки" }
    - { id: april_fools,  name: "April Fools' Day", month: 4,  day: 1,  lead_days: 7, theme: "розыгрыши, подмена реальности, неожиданные приколы, 'это была шутка'" }
    - { id: easter,       name: "Easter (светски)", rule: easter,       lead_days: 7, theme: "весна, кролики, поиск яиц, пастельные цвета, без религиозных мотивов" }
    - { id: star_wars,    name: "Star Wars Day (May the 4th)", month: 5, day: 4, lead_days: 7, theme: "космическая опера, джедаи и ситхи в духе пародии, 'May the Fourth be with you', без цитат длиннее фразы" }
    - { id: july4,        name: "4th of July",       month: 7,  day: 4,  lead_days: 7, theme: "лето, фейерверки, крыши и пикники, дух свободы без политики" }
    - { id: halloween,    name: "Halloween",         month: 10, day: 31, lead_days: 7, theme: "хоррор с юмором, костюмы, призраки, ведьмы, тыквы, жуткие и смешные истории" }
    - { id: thanksgiving, name: "Thanksgiving",      rule: thanksgiving, lead_days: 7, theme: "благодарность, семейный стол и хаос, остатки еды, уютные и смешные ситуации, без политики" }
    - { id: christmas,    name: "Christmas (светски)", month: 12, day: 25, lead_days: 7, theme: "снег, огни, подарки, уют, праздничный хаос, шапки Санты, без религиозных мотивов" }
    - { id: new_year,     name: "New Year's Eve",    month: 12, day: 31, lead_days: 7, theme: "обратный отсчёт, итоги года, резолюции и смена пути, вечеринка, полночь" }
    - { id: friday13,     name: "Friday the 13th",   rule: friday13,     lead_days: 3, theme: "суеверия, чёрные кошки, невезение, зеркала не бить, комичное 'проклятие'" }

# Жанры историй к фото: вес = относительная вероятность
genres:
  - { id: sci-fi,    name: sci-fi,                  weight: 1 }
  - { id: funny,     name: funny story,             weight: 1 }
  - { id: creepy,    name: creepy story,            weight: 1 }
  - { id: detective, name: mini detective story,    weight: 1 }
  - { id: fairy,     name: fairy tale,              weight: 1 }
  - { id: nostalgia, name: nostalgic memory,        weight: 1 }
  - { id: flirty,    name: flirty teasing story,    weight: 1 }

# Темы для текстовых постов (без фото)
topics:
  - tiny observation from NYC daily life
  - late-night thought
  - funny struggle of working in software testing, without details
  - career confusion and trying something new
  - playful question or dare to followers
  - flirty teasing line
  - coffee, weather or subway rant
  - joke about AI taking jobs
